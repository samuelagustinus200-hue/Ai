<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Ulang Tahun Canva Style</title>
    <style>
        /* Mengimpor font elegan khas Canva */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&family=Poppins:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slider-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 550px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15), 0 10px 20px rgba(0,0,0,0.05);
            cursor: grab;
        }

        .slider-container:active {
            cursor: grabbing;
        }

        .slider {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1); /* Animasi geser lebih natural */
            will-change: transform;
        }

        /* 
           Setiap slide memiliki background mesh gradient yang cerah & estetik 
           (Gaya warna pastel kekinian khas Canva) 
        */
        .slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .bg-1 { background: radial-gradient(circle at 10% 20%, #ff9a9e 0%, transparent 60%), radial-gradient(circle at 90% 80%, #fecfef 0%, transparent 60%), #fdfbfb; }
        .bg-2 { background: radial-gradient(circle at 80% 20%, #a1c4fd 0%, transparent 60%), radial-gradient(circle at 20% 80%, #c2e9fb 0%, transparent 60%), #f8fbff; }
        .bg-3 { background: radial-gradient(circle at 50% 0%, #d4fc79 0%, transparent 60%), radial-gradient(circle at 50% 100%, #96e6a1 0%, transparent 60%), #fafff4; }
        .bg-4 { background: radial-gradient(circle at 0% 100%, #84fab0 0%, transparent 60%), radial-gradient(circle at 100% 0%, #8fd3f4 0%, transparent 60%), #f2fdfb; }
        .bg-5 { background: radial-gradient(circle at 10% 10%, #ffc3a0 0%, transparent 60%), radial-gradient(circle at 90% 90%, #ffafbd 0%, transparent 60%), #fff8f5; }
        .bg-6 { background: radial-gradient(circle at 80% 80%, #fccb90 0%, transparent 60%), radial-gradient(circle at 20% 20%, #d57eeb 0%, transparent 60%), #faf3ff; }
        .bg-7 { background: radial-gradient(circle at 30% 70%, #e0c3fc 0%, transparent 60%), radial-gradient(circle at 70% 30%, #8ec5fc 0%, transparent 60%), #f7f3ff; }
        .bg-8 { background: radial-gradient(circle at 50% 50%, #4facfe 0%, transparent 70%), radial-gradient(circle at 100% 100%, #00f2fe 0%, transparent 60%), #eaf8ff; }
        .bg-9 { background: radial-gradient(circle at 90% 10%, #43e97b 0%, transparent 60%), radial-gradient(circle at 10% 90%, #38f9d7 0%, transparent 60%), #eafff6; }
        .bg-10 { background: radial-gradient(circle at 20% 50%, #fa709a 0%, transparent 60%), radial-gradient(circle at 80% 50%, #fee140 0%, transparent 60%), #fff5f8; }
        .bg-11 { background: radial-gradient(circle at 0% 0%, #a18cd1 0%, transparent 60%), radial-gradient(circle at 100% 100%, #fbc2eb 0%, transparent 60%), #f8f5ff; }
        .bg-12 { background: radial-gradient(circle at 10% 90%, #f6d365 0%, transparent 60%), radial-gradient(circle at 90% 10%, #fda085 0%, transparent 60%), #fffcf5; }

        /* Tekstur dot pattern di atas background untuk efek kanvas */
        .texture-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
            background-size: 15px 15px;
            z-index: 1;
            pointer-events: none;
        }

        /* Glassmorphism Card (Efek Kaca) */
        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); /* Dukungan Safari */
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            width: 85%;
            padding: 40px 30px;
            text-align: center;
            z-index: 2;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
            position: relative;
        }

        /* Ornamen Tanda Kutip khas Canva */
        .glass-card::before {
            content: '“';
            font-family: 'Playfair Display', serif;
            font-size: 100px;
            font-style: italic;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.05);
            position: absolute;
            top: -20px;
            left: 20px;
            line-height: 1;
            pointer-events: none;
        }

        .decor {
            font-size: 45px;
            margin-bottom: 15px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));
            pointer-events: none;
        }

        .slide h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 15px;
            line-height: 1.3;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .slide p {
            font-size: 15px;
            line-height: 1.6;
            color: #4a4a4a;
            font-weight: 400;
            pointer-events: none;
        }
        
        .sender-note {
            font-size: 14px !important;
            font-weight: 600 !important;
            color: #e67e22 !important;
            margin-top: 20px;
            font-style: italic !important;
        }

        .slide-number {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(0, 0, 0, 0.4);
            font-weight: 600;
            letter-spacing: 3px;
        }

        .hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="slider-container" id="sliderContainer">
        <div class="slider" id="slider">
            <!-- Konten JS masuk ke sini -->
        </div>
    </div>

    <script>
        // ==========================================
        // UBAH NAMA DI SINI
        // ==========================================
        const namaPenerima = "butet"; // Ganti dengan nama yang ultah
        const namaPengirim = "Siahaan22"; // Ganti dengan nama kamu
        // ==========================================

        const quotes = [
            { icon: "✨", title: `Selamat Ulang Tahun,<br>${namaPenerima}!`, text: "Semoga hari ini seindah senyumanmu yang selalu berhasil menerangi hariku." },
            { icon: "🌟", title: "Teruslah Bersinar", text: "Bertambah satu tahun usiamu, bertambah pula pesona dan kebijaksanaan di dalam dirimu." },
            { icon: "🎁", title: "Kehadiranmu", text: "Tidak ada hadiah yang cukup berharga untuk menyamai arti kehadiranmu dalam hidupku." },
            { icon: "🕊️", title: "Kedamaian Hati", text: "Semoga setiap langkahmu di tahun ini selalu diiringi oleh kebahagiaan, tawa, dan kedamaian." },
            { icon: "📖", title: "Lembaran Baru", text: "Ulang tahun adalah awal yang baru. Semoga lembaran barumu diisi dengan cerita-cerita yang menakjubkan." },
            { icon: "🌻", title: "Versi Terbaik", text: "Terima kasih telah menjadi dirimu yang luar biasa. Kamu sangat pantas mendapatkan segala hal baik di dunia ini." },
            { icon: "🌙", title: "Mimpi Indah", text: "Jangan pernah berhenti bermimpi, karena dunia selalu butuh lebih banyak cahaya dari mimpi-mimpimu." },
            { icon: "😊", title: "Tawa Bahagia", text: "Doaku sederhana hari ini: semoga senyum dan tawa selalu menghiasi bibirmu, sekarang dan selamanya." },
            { icon: "💖", title: "Kebaikan Hati", text: "Kamu adalah bukti nyata bagiku bahwa kebaikan hati bisa membuat dunia ini terasa jauh lebih hangat." },
            { icon: "👑", title: "Tahun Keemasan", text: "Banggalah pada seberapa jauh kamu telah melangkah. Percayalah, ini akan menjadi tahun keemasanmu." },
            { icon: "🌱", title: "Kedewasaan", text: "Menua itu pasti, tetapi kedewasaan dan cinta kasih di hatimu adalah sebuah pilihan yang sangat indah." },
            { icon: "🎉", title: "Hari Istimewa", text: "Selamat merayakan hari kelahiranmu. Berbahagialah selalu, karena kamu sangat berarti bagiku.", isLast: true }
        ];

        const slider = document.getElementById('slider');
        const sliderContainer = document.getElementById('sliderContainer');
        const totalSlides = quotes.length;
        let currentIndex = 0;
        let autoSlideInterval;

        // Render HTML
        quotes.forEach((q, index) => {
            const slide = document.createElement('div');
            slide.className = `slide bg-${index + 1}`;
            
            const senderHTML = q.isLast ? `<p class="sender-note">Salam sayang dari,<br>${namaPengirim} ❤️</p>` : "";
            const hintHTML = index === 0 ? `<div class="hint">Geser untuk membaca</div>` : "";

            // Struktur HTML diperbarui untuk efek Glassmorphism Canva
            slide.innerHTML = `
                ${hintHTML}
                <div class="texture-overlay"></div>
                <div class="glass-card">
                    <div class="decor">${q.icon}</div>
                    <h2>${q.title}</h2>
                    <p>${q.text}</p>
                    ${senderHTML}
                    <div class="slide-number">${index + 1} / 12</div>
                </div>
            `;
            slider.appendChild(slide);
        });

        // ==========================================
        // LOGIKA SLIDER (Geser Otomatis & Manual)
        // ==========================================
        function updateSlider() {
            slider.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % totalSlides;
            updateSlider();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            updateSlider();
        }

        function startAutoSlide() {
            autoSlideInterval = setInterval(nextSlide, 5000); // Otomatis tiap 5 detik
        }

        function resetAutoSlide() {
            clearInterval(autoSlideInterval);
            startAutoSlide();
        }

        startAutoSlide(); 

        let startX = 0;
        let endX = 0;
        let isDragging = false;

        function handleSwipe() {
            const threshold = 50; 
            if (startX - endX > threshold) {
                nextSlide();
                resetAutoSlide();
            } else if (endX - startX > threshold) {
                prevSlide();
                resetAutoSlide();
            }
        }

        sliderContainer.addEventListener('touchstart', (e) => { startX = e.changedTouches[0].screenX; });
        sliderContainer.addEventListener('touchend', (e) => { endX = e.changedTouches[0].screenX; handleSwipe(); });
        sliderContainer.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; });
        sliderContainer.addEventListener('mouseup', (e) => { if (!isDragging) return; isDragging = false; endX = e.clientX; handleSwipe(); });
        sliderContainer.addEventListener('mouseleave', () => { if (isDragging) isDragging = false; });
    </script>
</body>
</html>
